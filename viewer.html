<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Text margin inside each magazine page:
       side margins stay, top/bottom are small so text isn't pushed off the page */
    #book .stf__item {
      box-sizing: border-box;
      padding: clamp(14px, 3%, 28px) clamp(24px, 6%, 64px);
      overflow-x: hidden;
      overflow-y: auto;            /* scroll instead of cutting text off */
      scrollbar-width: thin;
    }

    /* Make the text fit the page better */
    #book .stf__item p,
    #book .stf__item li {
      font-size: clamp(0.78rem, 1.1vw, 0.95rem);
      line-height: 1.45;
      margin: 0 0 0.6em;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    #book .stf__item h1 { font-size: clamp(1.3rem, 2.4vw, 2rem); margin: 0 0 0.4em; }
    #book .stf__item h2 { font-size: clamp(1.05rem, 1.8vw, 1.5rem); margin: 0 0 0.4em; }
    #book .stf__item h3 { font-size: clamp(0.9rem, 1.4vw, 1.15rem); margin: 0 0 0.4em; }

    #book .stf__item h1,
    #book .stf__item h2,
    #book .stf__item h3 {
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* Images should never push text out of the page */
    #book .stf__item img {
      max-width: 100%;
      height: auto;
      max-height: 55%;
      object-fit: contain;
    }

    /* Full-bleed images (covers, artworks) should ignore the padding */
    #book .stf__item.full-bleed,
    #book .stf__item[data-density="hard"] {
      padding: 0;
      overflow: hidden;
    }

    /* Small screens: tighter margins so text still has room */
    @media (max-width: 640px) {
      #book .stf__item {
        padding: 12px 16px;
      }
    }
  </style>
  <title>Read the magazine</title>
</head>
<body class="viewer">

  <header class="viewer-top">
    <div class="left">
      <a class="btn back" href="magazine.html" aria-label="Back">Return to Magazine</a>
      <a class="brand" href="index.html" id="brand">Home</a>
    </div>

    <div class="tools">
      <button class="btn" id="contents" aria-pressed="false" aria-controls="rail">Contents</button>
      <span class="sep"></span>
      <button class="btn" id="zoomout" aria-label="Zoom out">−</button>
      <button class="btn" id="zoomreset" aria-label="Reset zoom">100%</button>
      <button class="btn" id="zoomin" aria-label="Zoom in">+</button>
      <span class="sep"></span>
      <button class="btn" id="fullscreen">Fullscreen</button>
    </div>
  </header>

  <div class="viewer-body">
    <nav class="rail" id="rail" aria-label="Jump to section"></nav>

    <div class="stage">
      <button class="arrow" id="prev" aria-label="Previous page">←</button>
      <button class="arrow" id="next" aria-label="Next page">→</button>

      <div class="book-area" id="book-area">
        <div class="book-holder" id="book-holder">
          <div id="book"></div>
        </div>
      </div>

      <div class="scrubber" id="scrubber"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>document.getElementById("brand").textContent = MAGAZINE.title;</script>
  <script src="js/flipbook.js"></script>
</body>
</html>
